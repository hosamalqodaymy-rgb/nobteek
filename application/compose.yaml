services:
  db-dev:
    image: postgres:17.11
    profiles: [dev]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your private .env}
      NOBTEEK_APP_USER: nobteek_dev
      NOBTEEK_APP_DATABASE: nobteek_development
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - nobteek_dev:/var/lib/postgresql/data
      - ./docker/init-app-user.sh:/docker-entrypoint-initdb.d/10-nobteek.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
  db-test:
    image: postgres:17.11
    profiles: [test]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your private .env.testing}
      NOBTEEK_APP_USER: nobteek_test
      NOBTEEK_APP_DATABASE: nobteek_test
    ports: ["127.0.0.1:5433:5432"]
    tmpfs: [/var/lib/postgresql/data]
    volumes:
      - ./docker/init-app-user.sh:/docker-entrypoint-initdb.d/10-nobteek.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  nobteek_dev:
