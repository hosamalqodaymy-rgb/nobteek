:root{
--color-primary:#0F766E;
--color-navy:#14364B;
--color-background:#F5F8FA;
--color-surface:#FFFFFF;
--color-text:#172B3A;
--color-muted:#526575;
--color-border:#D7E2E8;
--color-border-control:#6B7D89;
--color-success:#166534;
--color-success-bg:#DCFCE7;
--color-warning:#92400E;
--color-warning-bg:#FEF3C7;
--color-danger:#B42318;
--color-danger-bg:#FEF3F2;
--color-focus:#14364B;
--color-neutral-bg:#EAF0F4;
--color-disabled-bg:#E9EFF2;
--color-on-primary:#FFFFFF;
--color-primary-hover:#0D635C;
--color-primary-active:#0A504B;
--color-tint:#E7F1F1;
--font-family:"Tajawal",Tahoma, Arial, sans-serif;
--font-body:1rem;
--font-small:0.875rem;
--font-heading:1.75rem;
--font-hero:3rem;
--line-height:1.7;
--control-min-height:3rem;
--control-min-width:3rem;
--radius-control:0.5rem;
--radius-card:1rem;
--focus-width:2px;
--focus-offset:3px;
--max-content:1200px;
--space-0:0.0rem;
--space-1:0.25rem;
--space-2:0.5rem;
--space-3:0.75rem;
--space-4:1.0rem;
--space-5:1.25rem;
--space-6:1.5rem;
--space-8:2.0rem;
--space-10:2.5rem;
--space-12:3.0rem;
--space-16:4.0rem;
--space-20:5.0rem;
}

*{box-sizing:border-box}
html{font-size:100%;scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--color-text);font-family:var(--font-family);font-size:var(--font-body);line-height:var(--line-height)}
h1,h2,h3,p{margin-block-start:0}h1,h2,h3{color:var(--color-navy);font-weight:700;line-height:1.4}h2{font-size:var(--font-heading)}h3{font-size:1.125rem}
a{color:var(--color-primary)}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}
svg{display:block;flex-shrink:0}img{max-width:100%;height:auto}button{cursor:pointer}
.wrap{width:100%;max-width:var(--max-content);margin-inline:auto;padding-inline:var(--space-6)}
.site-header{background:var(--color-surface);border-block-end:1px solid var(--color-border)}
.header-row{display:flex;justify-content:space-between;align-items:center;gap:var(--space-6);padding-block:var(--space-5)}
.brand{display:inline-flex;align-items:center;gap:var(--space-3);color:var(--color-navy);font-weight:700;text-decoration:none;min-height:var(--control-min-height)}
.brand-mark{color:var(--color-primary);width:2.5rem;height:2.5rem}.brand-name{font-size:2rem;line-height:1.2}
.brand-en{font-size:var(--font-small);font-weight:500;letter-spacing:.04em;line-height:1.2;color:var(--color-muted)}
.header-links{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap}.nav-link{display:inline-flex;align-items:center;min-height:var(--control-min-height);padding-inline:var(--space-3);font-weight:500;text-decoration:none}
.skip-link{position:absolute;inset-inline-start:var(--space-4);top:-8rem;background:var(--color-surface);padding:var(--space-3);z-index:5}.skip-link:focus{top:var(--space-4)}
:where(a,button,input,select):focus-visible,.is-focused{outline:var(--focus-width) solid var(--color-focus);outline-offset:var(--focus-offset)}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:var(--space-16);padding-block:var(--space-16)}
.eyebrow{font-weight:700;color:var(--color-primary);margin-block-end:var(--space-4)}

   <section class="panel span-all"><h2 style="font-size:1.125rem">السجل السابق للجلسة</h2>${books.filter(b=>['cancelled','rejected','fulfilled'].includes(b.state)).length?'<ul class="records">'+books.filter(b=>['cancelled','rejected','fulfilled'].includes(b.state)).map(b=>recordBooking(b,s)).join('')+'</ul>':empty('لا توجد حجوزات منتهية أو ملغاة')}</section></div>`;
 }
 function doctor(){
  const data=api.snapshot(ctx()),s=selectedSession(data);if(!s)return empty('لا توجد جلسة لهذا الطبيب');const active=api.active(s.doctor_id),ready=api.ready(s.id);let activeHTML='';
  if(active){const b=api.bookings[active.booking_id];activeHTML=`<section class="panel current-visit"><div class="panel-head"><h2>المراجع الحالي</h2>${badge('visit',active.state)}</div><div class="current-number">${active.ticket_number}</div><p class="record-name">${h(b.display_name)}</p><div class="actions">${active.state==='called'?button('بدء الزيارة','start',`data-id="${active.id}" data-version="${active.version}"`)+button('غياب مؤقت','reason',`data-id="${active.id}" data-version="${active.version}" data-command="mark_away"`,'btn--secondary'):button('إنهاء الزيارة','complete',`data-id="${active.id}" data-version="${active.version}"`)}</div></section>`;}
  else activeHTML=`<section class="panel"><h2 style="font-size:1.125rem">الطبيب متاح</h2><p class="muted">${ready.length?'يمكن استدعاء أول مراجع حاضر.':'لا يوجد مراجعون منتظرون.'}</p>${button('استدعاء التالي','call_next',`data-id="${s.id}" data-version="${s.version}" ${!ready.length||s.state!=='open'?'disabled':''}`)}</section>`;
  const statusAction=s.state==='open'?button('إيقاف الجلسة مؤقتا','reason',`data-id="${s.id}" data-version="${s.version}" data-command="pause"`,'btn--secondary'):s.state==='paused'?button('استئناف الجلسة','reason',`data-id="${s.id}" data-version="${s.version}" data-command="resume"`,'btn--secondary'):'';
  return heading('شاشة الطبيب',api.doctors[s.doctor_id].display_name,statusAction)+`<div class="toolbar">${sessionPicker(data,s)}${badge('session',s.state)}</div>`+activeHTML+`<section class="panel"><div class="panel-head"><h2>المنتظرون الحاضرون</h2><span class="count">${ready.length}</span></div>${ready.length?'<ul class="records">'+ready.map(v=>recordVisit(v,s,true)).join('')+'</ul>':empty('لا يوجد منتظرون حاضرون')}</section>`;
 }
 function bookingForm(){
  const doctors=Object.values(api.doctors).filter(d=>d.clinic_id===u.clinic);if(!doctors.some(d=>d.id===u.draft.doctor_id))u.draft.doctor_id=doctors[0].id;
  const sessions=Object.values(api.sessions).filter(s=>s.clinic_id===u.clinic&&s.doctor_id===u.draft.doctor_id&&s.state!=='closed'&&api.clock()<+new Date(s.ends_at));
  const windows=sessions.flatMap(s=>s.windows.filter(w=>api.clock()<+new Date(w.ends_at)).map(w=>({...w,session_id:s.id})));
  if(!windows.some(w=>w.id===u.draft.window_id))u.draft.window_id=windows[0]?.id||'';
  return heading('طلب حجز',api.clinics[u.clinic].name_ar)+`<div class="patient-wrap"><section class="panel patient-card"><h2>اختر الطبيب وفترة الحضور</h2><p class="muted">${h(api.clinics[u.clinic].landmark)}</p><form id="booking-form">
   <div class="field"><label for="patient-doctor">الطبيب</label><select id="patient-doctor" name="doctor_id">${doctors.map(d=>option(d.id,d.display_name,u.draft.doctor_id)).join('')}</select></div>
   <div class="field"><label for="patient-window">فترة الحضور</label><select id="patient-window" name="window_id" ${windows.length?'':'disabled'}>${windows.length?windows.map(w=>option(w.id,time(w.starts_at)+' إلى '+time(w.ends_at),u.draft.window_id)).join(''):'<option>لا توجد فترات متاحة</option>'}</select></div>
   <div class="field"><label for="patient-name">اسم المراجع</label><input id="patient-name" name="display_name" minlength="2" maxlength="80" required value="${h(u.draft.display_name)}" autocomplete="off"></div>
   <div class="field"><label for="patient-phone">رقم التواصل</label><input id="patient-phone" name="contact_phone" type="tel" inputmode="tel" dir="ltr" required value="${h(u.draft.contact_phone)}" autocomplete="off" aria-describedby="patient-phone-help"><p class="field-help" id="patient-phone-help">يمكن استخدام رقم الأسرة لأكثر من مراجع.</p></div>
   <p class="patient-note">الفترة للحضور وليست وقت كشف مضمونا. يراجع الاستقبال طلبك، ويصدر رقم الدور عند تسجيل حضورك.</p>
   <button class="btn" type="submit" data-write ${disabled()||!windows.length?'disabled':''}>إرسال طلب الحجز</button></form></section></div>`;
 }
 function ticket(){
  const secret=location.hash.split('/')[2]||u.lastTokens[u.clinic];if(!secret)return heading('متابعة الحجز','تظهر هنا التذكرة الخاصة بطلبك')+empty('أرسل طلب حجز تجريبيا أولا ثم افتح تذكرته.');
  let dto;try{dto=api.ticket(secret);}catch(e){return heading('رابط غير متاح','راجع الاستقبال للحصول على الرابط الصحيح.')+empty('لم نعثر على تذكرة صالحة لهذا الرابط.');}
  let body='';const v=dto.visit_state;
  if(dto.booking_state==='pending')body='<p class="ahead">طلبك قيد المراجعة</p><p class="muted">لم يتأكد الحجز بعد، ولم يصدر رقم دور.</p>';
  else if(['cancelled','rejected'].includes(dto.booking_state))body=badge('booking',dto.booking_state)+'<p class="muted">يمكنك التواصل مع الاستقبال أو إرسال طلب جديد.</p>';
  else if(!v)body='<p class="ahead">حجزك مؤكد</p><p class="muted">راجع الاستقبال عند الوصول لتسجيل حضورك وإصدار رقم دورك.</p>';
  else{
   let note=v==='waiting'?(dto.waiting_ahead===0?(dto.doctor_state==='in_service'?'أنت التالي بعد انتهاء الزيارة الحالية':dto.doctor_state==='called'?'أنت التالي بعد المراجع المستدعى':'أنت التالي للاستدعاء'):'أمامك '+dto.waiting_ahead+' من المنتظرين الحاضرين'):v==='called'?'تم استدعاؤك':v==='in_service'?'الزيارة جارية':v==='completed'?'اكتملت الزيارة':v==='away'?'راجع الاستقبال عند العودة لإدراجك في نهاية المنتظرين':'سجلت مغادرتك للعيادة';
   body=`<p class="muted">رقم تذكرتك</p><div class="ticket-big">${dto.ticket_number}</div><div class="status-line">${badge('visit',v)}</div><p class="ahead">${h(note)}</p><p class="muted">ترتيب الدور يتغير حسب الحاضرين والأولوية المخولة.</p>`;
  }
  return heading('تذكرتك الخاصة','متابعة حالة الحجز والحضور')+`<div class="patient-wrap"><section class="panel patient-card ticket">${body}<p class="ticket-time">فترة الحضور ${h(time(dto.window_starts_at))} إلى ${h(time(dto.window_ends_at))}</p><p class="ticket-time">آخر تحديث ${h(time(dto.server_time))}</p><div class="actions"><button class="btn btn--secondary" type="button" data-action="refresh">تحديث الحالة</button><a class="btn btn--quiet" href="#/help">المساعدة</a></div></section></div>`;
 }
 function wall(){
  const data=api.snapshot(ctx());return heading('شاشة الصالة','أرقام الدور دون أسماء أو هواتف المراجعين')+`<div class="wall-grid">${data.sessions.filter(s=>s.state!=='closed').map(s=>{const active=api.active(s.doctor_id);return `<section class="wall-card"><h2>${h(api.doctors[s.doctor_id].display_name)}</h2><p>المستدعى أو داخل الكشف</p><div class="wall-active">${active?.ticket_number||'—'}</div><p>الأرقام التالية</p><div class="wall-next">${api.ready(s.id).slice(0,4).map(v=>'<span>'+v.ticket_number+'</span>').join('')||'<span>—</span>'}</div></section>`;}).join('')}</div>`;
 }
 function owner(){const data=api.snapshot(ctx()),r=api.report(ctx());return heading('لوحة المالك','ملخص تشغيل عيادتك',button('تصدير التقرير','export','','btn--secondary'))+
  `<div class="stats">${[['زيارات مكتملة',r.completed],['منتظرون',r.waiting],['مغادرون',r.left],['أوقات ناقصة',r.missing_times]].map(([label,n])=>`<div class="stat"><p>${label}</p><strong>${n}</strong></div>`).join('')}</div>
  <section class="panel"><h2 style="font-size:1.125rem">الانتظار المسجل</h2><p class="metric-number">${r.average_wait_minutes==null?'لا توجد زيارات مكتملة الأوقات':r.average_wait_minutes.toFixed(1)+' دقيقة'}</p><p class="muted">يحسب من الوصول إلى بدء الكشف للزيارات ذات الأوقات المكتملة. لا يثبت هذا الرقم وحده تحسن الخدمة.</p></section>
  <section class="panel"><h2 style="font-size:1.125rem">جلسات العيادة</h2><ul class="records">${data.sessions.map(s=>`<li class="record"><div class="record-top"><p class="record-name">${h(api.doctors[s.doctor_id].display_name)}</p>${badge('session',s.state)}</div><p class="record-meta">${h(time(s.starts_at))} إلى ${h(time(s.ends_at))} · السعة المستخدمة ${api.occupied(s)} من ${s.windows.reduce((n,w)=>n+w.capacity,0)}</p></li>`).join('')}</ul></section>
  <section class="panel"><h2 style="font-size:1.125rem">سجل العمليات</h2>${data.events.length?'<ul class="records">'+data.events.slice(-8).reverse().map(e=>`<li class="record"><p class="record-name">${h(eventName(e.type))}</p><p class="record-meta">${h(time(e.at))} · ${h(roleNames[api.actors[e.actor_id]?.role]||'موظف مخول')}</p></li>`).join('')+'</ul>':empty('لا توجد عمليات بعد')}</section>`;}
 function eventName(type){return ({'booking.request':'طلب حجز','booking.confirm':'تأكيد حجز','booking.cancel':'إلغاء حجز','booking.reject':'رفض طلب','booking.reschedule':'تعديل فترة الحضور','visit.check_in':'تسجيل حضور','visit.call_next':'استدعاء مراجع','visit.start':'بدء زيارة','visit.complete':'إنهاء زيارة','visit.mark_away':'غياب مؤقت','visit.return':'عودة مراجع','visit.leave':'تسجيل مغادرة','visit.priority':'أولوية مخولة','session.created':'إضافة جلسة','session.capacity':'تعديل السعة','clinic.updated':'تعديل معلومات العيادة','membership.delegated':'تعديل تفويض الاستقبال','session.pause':'إيقاف الجلسة','session.resume':'استئناف الجلسة','session.open':'فتح الجلسة','session.close':'إغلاق الجلسة'})[type]||'تحديث مسجل';}

 function login(){return heading('الدخول التجريبي','اختر دورا لمعاينة مهام العيادة')+`<section class="panel patient-wrap"><p class="patient-note">هذه حسابات عرض ببيانات وهمية. اختيار الدور هنا مخصص للمعاينة.</p><div class="login-options">${['reception','doctor','owner','platform_admin'].map(r=>`<button class="btn ${r==='reception'?'':'btn--secondary'}" type="button" data-action="login-demo" data-role="${r}">دخول ${h(roleNames[r])}</button>`).join('')}</div></section>`;}
 function help(){return heading('المساعدة والخصوصية','توضيح الحجز والدور والبيانات')+`<div class="work-grid"><section class="panel"><h2 style="font-size:1.125rem">ما معنى فترة الحضور؟</h2><p>هي الفترة المناسبة لوصولك. يبدأ الدور بعد تسجيل الحضور، وقد يتغير وقت الكشف حسب مدة الزيارات وحالة الطبيب.</p></section><section class="panel"><h2 style="font-size:1.125rem">ماذا يحدث عند المغادرة المؤقتة؟</h2><p>يسجل الاستقبال غيابك مؤقتا. عند العودة تدخل نهاية المنتظرين مع الاحتفاظ برقم التذكرة.</p></section><section class="panel"><h2 style="font-size:1.125rem">بيانات هذه المعاينة</h2><p>كل البيانات تجريبية داخل جلسة العرض. لا تدخل بيانات حقيقية. إعادة بيانات العرض أو إعادة تحميل الصفحة تصفّر التجربة.</p></section><section class="panel"><h2 style="font-size:1.125rem">الرابط والهاتف</h2><p>لكل طلب رابط متابعة مستقل. رقم هاتف الأسرة قد يستخدم لأكثر من مراجع، ولا يستخرج تاريخ المراجعين بإدخال الهاتف وحده.</p></section></div>`;}

  const notice=u.notice?message(u.notice.kind,u.notice.title,u.notice.text):'';
  app.innerHTML=`<header class="product-header"><a class="brand" href="#/welcome"><img class="brand-mark" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiByb2xlPSJpbWciPjx0aXRsZT7ZhtmI2KjYqtmK2YMg2LHZhdiyPC90aXRsZT48ZyB0cmFuc2Zvcm09InRyYW5zbGF0ZSgwIDApIHNjYWxlKDEuMCkiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzBGNzY2RSIgc3Ryb2tlLXdpZHRoPSIxLjgiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+CjxwYXRoIGQ9Ik02IDNoMTJhMyAzIDAgMCAxIDMgM3YzYTMgMyAwIDAgMCAwIDZ2M2EzIDMgMCAwIDEtMyAzSDZhMyAzIDAgMCAxLTMtM3YtM2EzIDMgMCAwIDAgMC02VjZhMyAzIDAgMCAxIDMtM1oiLz4KPHBhdGggZD0iTTcgNy41aDEwTTcgMTEuNWg2TTcgMTUuNWgzIi8+PGNpcmNsZSBjeD0iMTUuOCIgY3k9IjE1LjUiIHI9IjEuNSIgZmlsbD0iIzBGNzY2RSIgc3Ryb2tlPSJub25lIi8+PC9nPjwvc3ZnPg==" alt="" width="40" height="40"><span class="brand-name">${h(B.nameAr)}</span></a><div class="clinic-context"><div><p><strong>${h(api.clinics[u.clinic].name_ar)}</strong></p><p class="context-label">${h(roleNames[u.role])} · ${h(time(api.now))}</p></div></div></header><div class="shell"><nav class="side-nav" aria-label="شاشات المعاينة">${navigation(view)}</nav><main class="main" id="main-content">${u.mode==='offline'?statePanel('offline'):''}${notice}${html}<footer class="app-footer">معاينة ببيانات وهمية · ${h(B.tagline)}</footer></main></div>`;
  if(focusId)requestAnimationFrame(()=>document.getElementById(focusId)?.focus());
  if(u.busy)document.querySelectorAll('#demo-panel select,#demo-panel button,[data-write],[data-delegate]').forEach(el=>el.disabled=true);
 }
 function navigate(view){if(location.hash==='#/'+view)render('page-title');else location.hash='/'+view;}
 function showNotice(kind,title,text){u.notice={kind,title,text};render('notice');}
 function closeDialog(){if(dialog.open)dialog.close();u.dialogAction=null;}
 function modal(title,fields,action,label='حفظ'){u.dialogAction=action;dialog.innerHTML=`<form id="modal-form"><header class="dialog-head"><h2 id="dialog-title">${h(title)}</h2><button type="button" class="btn btn--quiet" data-action="close-dialog">إغلاق</button></header><div class="dialog-body">${fields}</div><p class="dialog-error" id="dialog-error" role="alert"></p><footer class="dialog-actions"><button type="submit" class="btn" data-write ${disabled()?'disabled':''}>${h(label)}</button><button type="button" class="btn btn--secondary" data-action="close-dialog">رجوع</button></footer></form>`;dialog.showModal();requestAnimationFrame(()=>dialog.querySelector('input,select')?.focus());}
 function field(label,name,value='',type='text',required=true){return `<div class="field"><label for="modal-${name}">${h(label)}</label><input id="modal-${name}" name="${name}" type="${type}" ${type==='tel'?'dir="ltr" inputmode="tel"':''} ${required?'required':''} value="${h(value)}" ${name==='display_name'?'minlength="2" maxlength="80"':''}></div>`;}
 const reasonField=()=>`<div class="field"><label for="modal-reason">سبب الإجراء</label><select id="modal-reason" name="reason" required><option value="patient_request">بطلب المراجع</option><option value="not_present">المراجع غير حاضر حاليا</option><option value="operational_adjustment">تعديل تشغيلي موثق</option></select></div>`;
 function actionVersion(el){return {id:el.dataset.id,version:Number(el.dataset.version)};}
 function newBooking(direct){const data=api.snapshot(ctx()),s=selectedSession(data);if(!s)return;modal(direct?'مراجع مباشر':'طلب حجز هاتفي',field('اسم المراجع','display_name')+field(direct?'رقم التواصل اختياري':'رقم التواصل','contact_phone','','tel',!direct)+(direct?'':`<div class="field"><label for="modal-window_id">فترة الحضور</label><select id="modal-window_id" name="window_id">${s.windows.map(w=>option(w.id,time(w.starts_at)+' إلى '+time(w.ends_at))).join('')}</select></div>`),{command:direct?'walk_in':'request',id:s.id},direct?'تسجيل الحضور المباشر':'إضافة طلب الحجز');}
 async function perform(command,id,body={},version){
  if(u.busy)return;const requestContext={...ctx()},requestClinic=u.clinic;u.busy=true;
  document.querySelectorAll('#demo-panel select,#demo-panel button,[data-write],[data-delegate]').forEach(el=>el.disabled=true);
  const submit=dialog.querySelector('[type=submit]');if(submit){submit.disabled=true;submit.textContent='جاري الحفظ';}
  try{await new Promise(resolve=>setTimeout(resolve,100));const result=api.command(requestContext,command,id,body,{key:'ui-'+(++u.requestCounter)+'-'+Math.random().toString(36).slice(2),expected:version}).data;
   if(result.secret)u.lastTokens[requestClinic]=result.secret;closeDialog();u.busy=false;u.notice={kind:'success',title:command==='request'?'تم إرسال الطلب للمراجعة':command==='walk_in'||command==='check_in'?'تم تسجيل الحضور':command==='complete'?'اكتملت الزيارة':'تم تحديث الحالة',text:command==='request'?'الطلب معلق، ولا يمنح رقم دور قبل تأكيده وتسجيل الحضور.':''};render('notice');return result;
  }catch(error){u.busy=false;render();const text=errors[error.code]||'تعذر إكمال الإجراء.';if(dialog.open){document.getElementById('dialog-error').textContent=text;if(submit){submit.disabled=false;submit.textContent='إعادة المحاولة';}}else showNotice('danger','تعذر إكمال الإجراء',text);}
 }
 function reset(seed){api=new DemoTransport(window.NOBTEEK_DEMO_FIXTURES,{seed});u.session=u.clinic==='CLINIC_A'?'SESSION_A':'SESSION_B';u.mode='normal';u.notice=null;u.search='';u.lastTokens={};u.draft.display_name='';u.draft.contact_phone='';closeDialog();render('page-title');}
 document.addEventListener('click',event=>{
  const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
  if(u.busy&&!['dismiss','close-dialog'].includes(action))return;
  if(action==='dismiss'){u.notice=null;render();return;}if(action==='close-dialog'){closeDialog();return;}if(action==='refresh'){u.mode='normal';api.mode='normal';u.notice=null;render('page-title');return;}
  if(action==='reset-starter'||action==='reset-empty'){reset(action==='reset-starter');return;}
  if(action==='advance-five'||action==='advance-hour'){api.advance(action==='advance-five'?5:60);render();return;}
  if(action==='login-demo'){u.role=el.dataset.role;u.session=u.clinic==='CLINIC_A'?'SESSION_A':'SESSION_B';navigate(u.role==='owner'?'owner':u.role==='platform_admin'?'admin':u.role);return;}
  if(action==='new-phone'||action==='new-walkin'){newBooking(action==='new-walkin');return;}
  const {id,version}=actionVersion(el);
  if(action==='reason'){
   const cmd=el.dataset.command;modal(cmd==='cancel'?'إلغاء الحجز':cmd==='reject'?'رفض طلب الحجز':cmd==='priority'?'أولوية يحددها الطبيب':'تأكيد الإجراء',cmd==='priority'?'<p>يسجل القرار باسم الطبيب، ويحافظ على رقم التذكرة ولا يوقف الزيارة الجارية.</p>':reasonField(),{command:cmd,id,version},cmd==='cancel'?'تأكيد إلغاء الحجز':'تأكيد الإجراء');return;
  }
  if(action==='reschedule'){const b=api.bookings[id],s=api.sessions[b.session_id];modal('تعديل فترة الحضور',`<div class="field"><label for="modal-window_id">فترة الحضور الجديدة</label><select id="modal-window_id" name="window_id">${s.windows.map(w=>option(w.id,time(w.starts_at)+' إلى '+time(w.ends_at),b.window_id)).join('')}</select></div>`+reasonField(),{command:'reschedule',id,version,session_id:s.id},'تعديل الفترة');return;}
  if(action==='capacity'){const s=api.sessions[id],w=api.window(s,el.dataset.window);modal('تعديل سعة الفترة',field('السعة','capacity',w.capacity,'number')+reasonField(),{command:'capacity',id,version,window_id:w.id});return;}
  if(action==='new-session'){const docs=Object.values(api.doctors).filter(d=>d.clinic_id===u.clinic);modal('إضافة جلسة',`<div class="field"><label for="modal-doctor_id">الطبيب</label><select id="modal-doctor_id" name="doctor_id">${docs.map(d=>option(d.id,d.display_name)).join('')}</select></div>`+field('تاريخ الجلسة','date','2026-11-07','date')+field('بداية الحضور','start','18:00','time')+field('نهاية الحضور','end','20:00','time')+field('السعة','capacity','4','number'),{command:'new_session',id:u.clinic},'إضافة الجلسة');return;}
  if(action==='export'){const r=api.report(ctx()),content='\uFEFFالمؤشر,القيمة\nزيارات مكتملة,'+r.completed+'\nمنتظرون,'+r.waiting+'\nمغادرون,'+r.left+'\nأوقات ناقصة,'+r.missing_times+'\n';const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));link.download='Nobteek_Demo_Report.csv';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);return;}
  if(['confirm','check_in','call_next','start','complete','return','open'].includes(action))perform(action,id,{},version);
 });
 document.addEventListener('submit',event=>{
  event.preventDefault();const form=event.target,data=Object.fromEntries(new FormData(form));
  if(form.id==='modal-form'){const a=u.dialogAction;if(!a)return;const body={...data};if(a.command==='priority')body.reason='clinical_priority';if(a.window_id)body.window_id=a.window_id;if(a.session_id)body.session_id=a.session_id;
   if(a.command==='request')body.source='phone';if(a.command==='new_session'){body.starts_at=data.date+'T'+data.start+':00+03:00';body.ends_at=data.date+'T'+data.end+':00+03:00';body.capacity=Number(data.capacity);}perform(a.command,a.id,body,a.version);
  }else if(form.id==='booking-form'){u.draft={...u.draft,...data};const s=Object.values(api.sessions).find(s=>s.windows.some(w=>w.id===data.window_id));if(s)perform('request',s.id,data).then(result=>{if(result)navigate('ticket/'+result.secret);});}
  else if(form.id==='clinic-form')perform('clinic_update',u.clinic,data);
  else if(form.id==='search-form'){u.search=data.query.trim();render('search-name');}
 });
 document.addEventListener('change',event=>{
  const el=event.target;
  if(el.id==='demo-role'){closeDialog();u.role=el.value;u.notice=null;u.search='';u.session=u.clinic==='CLINIC_A'?(u.doctor==='DR_C'?'SESSION_C':'SESSION_A'):'SESSION_B';navigate(u.role==='public'?'book':u.role==='owner'?'owner':u.role==='platform_admin'?'admin':u.role);render();}
  else if(el.id==='demo-clinic'){closeDialog();u.clinic=el.value;u.doctor=u.clinic==='CLINIC_A'?'DR_A':'DR_B';u.session=u.clinic==='CLINIC_A'?'SESSION_A':'SESSION_B';u.notice=null;u.search='';render();}
  else if(el.id==='demo-doctor'){u.doctor=el.value;u.session=Object.values(api.sessions).find(s=>s.doctor_id===u.doctor)?.id||'';render();}
  else if(el.id==='demo-state'){closeDialog();u.mode=el.value;api.mode=el.value;u.notice=null;render();}
  else if(el.id==='session-select'){u.session=el.value;u.search='';render();}
  else if(el.id==='patient-doctor'){u.draft.doctor_id=el.value;render();}
  else if(el.dataset.delegate)perform('delegate',u.clinic,{actor_id:el.dataset.delegate,can_call:el.checked});
 });
 document.addEventListener('input',event=>{if(event.target.id==='patient-name')u.draft.display_name=event.target.value;if(event.target.id==='patient-phone')u.draft.contact_phone=event.target.value;});
 dialog.addEventListener('cancel',()=>{u.dialogAction=null;});
 window.addEventListener('hashchange',()=>{closeDialog();u.notice=null;render('page-title');window.scrollTo({top:0,behavior:'instant'});});
 render();
 // No production services or persisted patient data are attached to this preview.
})();
