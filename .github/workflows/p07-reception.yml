name: Nobteek P07 reception
on:
  push:
    branches: [main, 'work/p07-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p07-reception-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reception:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: application
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: nobteek_ci_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: nobteek_test_ci
      DB_USERNAME: nobteek_test
      DB_PASSWORD: nobteek_ci_only
      NOBTEEK_DEMO_SEED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, dom, curl, zip, pdo_pgsql
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version-file: application/.node-version
          cache: npm
          cache-dependency-path: application/package-lock.json
      - name: Install locked dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer show --direct
          npm ci --no-audit --no-fund
          cp .env.example .env
          php artisan key:generate --no-interaction
      - name: Create isolated non-superuser test database
        env:
          PGPASSWORD: nobteek_ci_only
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE nobteek_test LOGIN PASSWORD 'nobteek_ci_only' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE DATABASE nobteek_test_ci OWNER nobteek_test;
          CREATE DATABASE nobteek_test_browser OWNER nobteek_test;
          SQL
      - name: Format changed PHP with Pint
        run: |
          vendor/bin/pint --dirty --format agent
          vendor/bin/pint app/Services/ReceptionCommands.php app/Http/Controllers/ReceptionController.php app/Policies/VisitPolicy.php app/Models/Visit.php routes/web.php app/Http/Middleware/HandleInertiaRequests.php ../tools/prepare_p07_browser.php ../tools/p07_test_server.php tests/ReceptionTestCase.php tests/Feature/Reception*Test.php --format agent
      - name: Build and exercise P07 on PostgreSQL
        run: |
          npm run build
          php artisan migrate --seed --force --no-interaction
          php artisan route:list --path=v1
          mkdir -p ../results/p07-browser-ci
          php artisan test --compact --filter=Reception --log-junit=../results/p07-browser-ci/phpunit.xml
      - name: Prepare ephemeral test credentials
        run: |
          python3 - <<'PY'
          import base64, os, secrets, datetime
          now = datetime.datetime.now(datetime.timezone.utc)
          clock = now.replace(minute=(now.minute // 15) * 15, second=0, microsecond=0).strftime('%Y-%m-%dT%H:%M:%SZ')
          values = {'NOBTEEK_BROWSER_CLOCK': clock, 'NOBTEEK_BROWSER_PASSWORD': secrets.token_urlsafe(32), 'NOBTEEK_BROWSER_MFA_SECRET': base64.b32encode(secrets.token_bytes(20)).decode(), 'NOBTEEK_BROWSER_TOOLS': os.path.join(os.environ['RUNNER_TEMP'], 'nobteek-browser-tools')}
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              for key, value in values.items():
                  if key in {'NOBTEEK_BROWSER_PASSWORD', 'NOBTEEK_BROWSER_MFA_SECRET'}: print('::add-mask::' + value)
                  f.write(key + '=' + value + '\n')
          PY
      - name: Install pinned browser tools outside application dependencies
        working-directory: .
        run: |
          npm install --prefix "$NOBTEEK_BROWSER_TOOLS" --no-package-lock --no-audit --no-fund playwright@1.65.0
          "$NOBTEEK_BROWSER_TOOLS/node_modules/.bin/playwright" install --with-deps chromium
      - name: Seed isolated P07 browser database and start four HTTP workers
        env:
          DB_DATABASE: nobteek_test_browser
          SESSION_DRIVER: file
          CACHE_STORE: array
          MAIL_MAILER: array
          QUEUE_CONNECTION: sync
        run: |
          php artisan migrate --seed --force --no-interaction
          php ../tools/prepare_p07_browser.php
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8000 -t public ../tools/p07_test_server.php > ../results/p07-browser-ci/server.log 2>&1 &
          echo "NOBTEEK_BROWSER_SERVER_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8000/login > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run P07 browser journeys and distinct staff HTTP races
        working-directory: .
        env:
          DB_DATABASE: nobteek_test_browser
        run: node tools/validate_p07_browser.cjs
      - name: Stop isolated server
        if: always()
        run: |
          if [ -n "${NOBTEEK_BROWSER_SERVER_PID:-}" ]; then kill "$NOBTEEK_BROWSER_SERVER_PID" || true; fi
      - name: Verify committed PHP formatting
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nobteek-p07-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            application/app/Services/ReceptionCommands.php
            application/app/Http/Controllers/ReceptionController.php
            application/app/Policies/VisitPolicy.php
            application/app/Models/Visit.php
            application/app/Http/Middleware/HandleInertiaRequests.php
            application/routes/web.php
            application/tests/ReceptionTestCase.php
            application/tests/Feature/Reception*Test.php
            tools/prepare_p07_browser.php
            tools/p07_test_server.php
            results/p07-browser-ci/
