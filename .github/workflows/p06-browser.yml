name: Nobteek P06 browser acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: nobteek_ci_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: nobteek_test_browser
      DB_USERNAME: nobteek_test
      DB_PASSWORD: nobteek_ci_only
      NOBTEEK_DEMO_SEED: "true"
      SESSION_DRIVER: file
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, dom, curl, zip, pdo_pgsql
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version-file: application/.node-version
          cache: npm
          cache-dependency-path: application/package-lock.json
      - name: Install locked application dependencies and build
        working-directory: application
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer show --direct
          npm ci --no-audit --no-fund
          cp .env.example .env
          php artisan key:generate --no-interaction
          npm run build
          vendor/bin/pint ../tools/prepare_p06_browser.php --format agent
          git diff --exit-code -- ../tools/prepare_p06_browser.php
      - name: Create isolated browser database
        env:
          PGPASSWORD: nobteek_ci_only
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE nobteek_test LOGIN PASSWORD 'nobteek_ci_only' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE DATABASE nobteek_test_browser OWNER nobteek_test;
          SQL
      - name: Prepare ephemeral test credentials
        run: |
          python3 - <<'PY'
          import base64, os, secrets
          values = {'NOBTEEK_BROWSER_PASSWORD': secrets.token_urlsafe(32), 'NOBTEEK_BROWSER_MFA_SECRET': base64.b32encode(secrets.token_bytes(20)).decode(), 'NOBTEEK_BROWSER_TOOLS': os.path.join(os.environ['RUNNER_TEMP'], 'nobteek-browser-tools')}
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              for key, value in values.items():
                  if key != 'NOBTEEK_BROWSER_TOOLS': print('::add-mask::' + value)
                  f.write(key + '=' + value + '\n')
          PY
      - name: Install pinned browser tools outside application dependencies
        run: |
          npm install --prefix "$NOBTEEK_BROWSER_TOOLS" --no-package-lock --no-audit --no-fund playwright@1.65.0
          "$NOBTEEK_BROWSER_TOOLS/node_modules/.bin/playwright" install --with-deps chromium
      - name: Seed synthetic data and start real Laravel server
        run: |
          cd application
          php artisan migrate --seed --force --no-interaction
          php ../tools/prepare_p06_browser.php
          PHP_CLI_SERVER_WORKERS=4 php artisan serve --host=127.0.0.1 --port=8000 --no-reload > "$RUNNER_TEMP/nobteek-browser-server.log" 2>&1 &
          echo "NOBTEEK_BROWSER_SERVER_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8000/login > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run real P06 browser journeys and layout matrix
        run: node tools/validate_p06_browser.cjs
      - name: Stop isolated server
        if: always()
        run: |
          if [ -n "${NOBTEEK_BROWSER_SERVER_PID:-}" ]; then kill "$NOBTEEK_BROWSER_SERVER_PID" || true; fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: p06-browser-evidence
          path: results/p06-browser-ci/
          if-no-files-found: warn
          retention-days: 14
