<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نوبتيك · مراجعة الحجوزات</title><style>body{margin:0;font:16px Tahoma;background:#eaf0f4;color:#14364b}header{padding:16px;background:white;position:sticky;top:0;z-index:1}h1{font-size:20px;margin:0 0 8px}label{display:inline-block;margin:5px}select,button{font:inherit;padding:8px}iframe{border:1px solid #6b7d89;display:block;margin:18px auto;height:1000px;background:#f5f8fa}main{overflow:auto}p{font-size:14px}</style></head><body><header><h1>نوبتيك · مراجعة الحجوزات</h1><p>مكونات الواجهة نفسها ببيانات عرض ونقل محاكى لا يتصل بالخادم ولا ينشئ حجوزات حقيقية.</p><label>الشاشة <select id="screen"><option value="BookingList">طلب معلق</option><option value="BookingConfirmed">حجز مؤكد</option><option value="BookingArrived">حجز مع حضور</option><option value="BookingStarted">زيارة بدأت</option><option value="BookingTerminal">حجز ملغى</option><option value="BookingEmpty">قائمة فارغة</option><option value="PublicBooking">طلب المراجع</option><option value="PublicEmpty">لا نوافذ متاحة</option></select></label><label>عرض الشاشة <select id="width"><option>360</option><option>768</option><option selected>1440</option></select></label><label>حجم النص <select id="zoom"><option value="100">100%</option><option value="200">200%</option></select></label><button id="update">عرض المعاينة</button></header><main><iframe id="preview" title="واجهة الحجوزات" style="width:1440px" src="preview-p06-frame.html?screen=BookingList"></iframe></main><script>document.getElementById('update').onclick=()=>{const frame=document.getElementById('preview');frame.style.width=document.getElementById('width').value+'px';frame.src='preview-p06-frame.html?screen='+document.getElementById('screen').value+'&zoom='+document.getElementById('zoom').value}</script></body></html>
