<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نوبتيك · مراجعة واجهات الحسابات</title><style>body{margin:0;font:16px Tahoma;background:#eaf0f4;color:#14364b}header{padding:16px;background:white;position:sticky;top:0;z-index:1}h1{font-size:20px;margin:0 0 8px}label{display:inline-block;margin:5px}select,button{font:inherit;padding:8px}iframe{border:1px solid #6b7d89;background:#f5f8fa;display:block;margin:18px auto;max-width:none;height:950px}main{overflow:auto}p{font-size:14px}</style></head><body><header><h1>نوبتيك · مراجعة واجهات الحسابات</h1><p>معاينة شكلية من مكونات البرنامج نفسها ببيانات وهمية. لا تحفظ النماذج ولا تتصل بقاعدة بيانات.</p><label>الشاشة <select id="screen"><option value="login">الدخول</option><option value="challenge">التحقق الإضافي</option><option value="recovery">الاستعادة</option><option value="activation">تعيين كلمة المرور</option><option value="security">أمان الحساب</option><option value="Workspace">مساحة العمل</option><option value="Team">الفريق</option><option value="Platform">ملاك العيادات</option><option value="Error">منع الوصول</option></select></label><label>عرض الشاشة <select id="width"><option>360</option><option>768</option><option selected>1440</option></select></label><label>حجم النص <select id="zoom"><option value="100">100%</option><option value="200">200%</option></select></label><button id="update">عرض المعاينة</button></header><main><iframe title="واجهة نوبتيك" id="preview" style="width:1440px" src="preview-frame.html?screen=login"></iframe></main><script>document.getElementById('update').onclick=()=>{const f=document.getElementById('preview');f.style.width=document.getElementById('width').value+'px';f.src='preview-frame.html?screen='+document.getElementById('screen').value+'&zoom='+document.getElementById('zoom').value}</script></body></html>
