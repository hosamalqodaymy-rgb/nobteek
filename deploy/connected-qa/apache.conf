<VirtualHost *:__PORT__>
    DocumentRoot /srv/nobteek/application/public
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    Header always set X-Robots-Tag "noindex, nofollow"
    Header always set Referrer-Policy "no-referrer"
    <Directory /srv/nobteek/application/public>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>
    LogLevel crit
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 "%m %>s"
</VirtualHost>
