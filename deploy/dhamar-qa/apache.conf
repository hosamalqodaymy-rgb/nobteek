<VirtualHost *:10000>
    DocumentRoot /srv/nobteek/application/public
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    Header always set X-Robots-Tag "noindex, nofollow"
    Header always set Referrer-Policy "no-referrer"
    <Directory /srv/nobteek/application/public>
        Options -Indexes
        AllowOverride All
        <RequireAny>
            Require expr "%{REQUEST_URI} == '/qa-access.php'"
            Require expr "%{REQUEST_URI} == '/up'"
            Require expr "req('Cookie') =~ /(^|;[ \t]*)nobteek_qa=__QA_ACCESS_MARKER__(;|$)/"
        </RequireAny>
    </Directory>
    ServerSignature Off
    LogLevel crit
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 "%m %>s"
</VirtualHost>
